[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salted-espresso"
version = "0.1.0"
description = "Tools to construct callable electronic densities from QM outputs"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "ase",
    "sphericart",
    "scipy",
    "PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "salted_espresso",
    "salted_espresso.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
